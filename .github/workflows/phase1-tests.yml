name: LifeOS Phase 1 regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/lifeos-phase-1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Phase 1 regression tests
        run: node --test tests/phase1.test.cjs
