name: Refresh LifeTracker data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-lifetracker.yml"
      - "scripts/export_sheets.py"
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - run: python scripts/export_sheets.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet_data.json
          if git diff --cached --quiet; then
            echo "No tracker changes."
          else
            git commit -m "Refresh LifeTracker sheet data"
            git push
          fi
