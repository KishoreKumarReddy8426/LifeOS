<script>
const DATA = '../sheet_data.json';
const TRACKERS = [
  ['daily', 'Daily Tracker'],
  ['study', 'Study Tracker'],
  ['podcast', 'Podcast Tracker'],
  ['health', 'Health Tracker']
];

const DEFAULT_GOALS = {

};

const SAMPLE_DATA = {
  daily: [

    { Date: '2026-10-02', 'Sleep Minutes': 430, 'Office Min': 470, 'Exercise Min': 40 },

  ],

    { Date: '2026-10-01', Minutes: 120, 'Article / Blogs': 30 },

    { Date: '2026-11-01', Minutes: 150, 'Article / Blogs': 25 },

  ],
  podcast: [
    { Date: '2026-10-01', 'Podcast Host': 'Lex Fridman', 'Podcast Name': 'Lex Fridman Podcast', 'Podcast Episode': '#440', Minutes: 75, 'Entertainment Min': 40, 'Movie Name': ' Dune: Part Two', Language: 'English', Year: 2024 },
    { Date: '2026-11-01', 'Podcast Host': 'Andrew Huberman', 'Podcast Name': 'Huberman Lab', 'Podcast Episode': 'Sleep Toolkit', Minutes: 60, 'Entertainment Min': 90, 'Movie Name': 'Inception', Language: 'English', Year: 2010 },
    { Date: '2026-11-02', 'Podcast Host': 'Nikhil Kamath', 'Podcast Name': 'WTF is', 'Podcast Episode': 'AI & India', Minutes: 55, 'Entertainment Min': 120, 'Movie Name': 'Baahubali 2', Language: 'Telugu', Year: 2017 }
  ],

    { Date: '2026-11-01', Steps: 10450, 'Distance KM': 7.9, 'Stairs Climbed': 14, 'Water (L)': 3.5 },
    { Date: '2026-11-02', Steps: 9800, 'Distance KM': 7.2, 'Stairs Climbed': 12, 'Water (L)': 3.3 }

let data = {};
let charts = {};
let activeMetric = {
  overview: 'sleep',
  daily: 'sleep',
  study: 'study',
  podcast: 'podcast',
  health: 'steps'
};

const $ = id => document.getElementById(id);
const norm = s => String(s ?? '').trim().toLowerCase().replace(/[_-]+/g, ' ').replace(/\s+/g, ' ');

const aliases = {
  date: ['date', 'day', 'datetime', 'timestamp'],
  sleep: ['sleep', 'sleep minutes', 'sleep hours', 'total sleep hours', 'sleep (hrs)', 'sleep hrs'],
  office: ['office', 'office min', 'office minutes', 'office hours', 'office (hrs)', 'work hours'],
  exercise: ['exercise', 'exercise min', 'exercise minutes', 'exercise hours', 'exercise (hrs)', 'workout'],
  study: ['study', 'study hours', 'study (hrs)', 'total study hours', 'hours', 'minutes'],
  articles: ['articles / blogs', 'article / blogs', 'article/blogs', 'articles/blogs', 'articles', 'blogs', 'article/blog time', 'hours.1'],
  podcast: ['podcast', 'podcast hours', 'podcast (hrs)', 'podcast listen', 'podcast listening', 'hours', 'minutes'],
  entertainment: ['entertainment', 'entertainment min', 'entertainment minutes', 'entertainment hours'],
  steps: ['steps', 'step count', 'total steps'],
  distance: ['distance', 'distance km', 'distance (km)', 'total distance'],
  water: ['water', 'water l', 'water (l)', 'water ml', 'water (ml)', 'water intake'],
  stairs: ['stairs', 'stairs climbed', 'floors climbed', 'stair count']
};

function key(r, k) {
  const a = aliases[k] || [k];
  return Object.keys(r || {}).find(x => a.some(y => norm(x) === norm(y))) || null;
}
function val(r, k) {
  const x = key(r, k);
  return x === null ? null : r[x];
}
function n(v) {
  const x = Number(String(v ?? '').replace(/,/g, '').replace(/[^0-9.-]/g, ''));
  return Number.isFinite(x) ? x : 0;
}
function durationHours(v) {
  if (v === null || v === undefined || String(v).trim() === '') return null;
  if (typeof v === 'number') return v;
  const s = String(v).trim();
  if (/^[-+]?\d*\.?\d+$/.test(s)) return Number(s);
  const hm = s.match(/(-?\d+(?:\.\d+)?)\s*hours?\s*(\d+(?:\.\d+)?)?\s*minutes?/i);
  if (hm) return Number(hm[1]) + (Number(hm[2] || 0) / 60);
  const mm = s.match(/(-?\d+(?:\.\d+)?)\s*minutes?/i);
  if (mm) return Number(mm[1]) / 60;
  return null;
}
function metricValue(r, k) {
  const get = names => {
    for (const name of names) {
      const col = Object.keys(r || {}).find(x => norm(x) === norm(name));
      if (col !== undefined && r[col] !== '' && r[col] !== null && r[col] !== undefined) return r[col];
    }
    return null;
  };
  const fromMinutes = (names, fallbackNames = []) => {
    let v = get(names);
    if (v !== null) return n(v) / 60;
    v = get(fallbackNames);
    return v === null ? null : durationHours(v);
  };
  switch (k) {
    case 'sleep': return fromMinutes(['Sleep Minutes'], ['Sleep Hours']);
    case 'office': return fromMinutes(['Office Min', 'Office Minutes'], ['Office Hours']);
    case 'exercise': return fromMinutes(['Exercise Min', 'Exercise Minutes'], ['Exercise Hours']);
    case 'study': return fromMinutes(['Minutes'], ['Hours']);
    case 'articles': return fromMinutes(['Article / Blogs', 'Articles / Blogs'], ['Hours.1', 'Hours_1']);
    case 'podcast': return fromMinutes(['Minutes'], ['Hours']);
    case 'entertainment': return fromMinutes(['Entertainment Min', 'Entertainment Minutes'], ['Entertainment Hours']);
    case 'water': {
      let v = get(['Water (L)', 'Water L']);
      if (v !== null) return n(v);
      v = get(['Water (ML)', 'Water ML']);
      return v === null ? null : n(v) / 1000;
    }
    case 'steps': {
      const v = get(['Steps']);
      return v === null ? null : n(v);
    }
    case 'distance': {
      const v = get(['Distance KM', 'Distance (KM)', 'Distance']);
      return v === null ? null : n(v);
    }
    case 'stairs': {
      const v = get(['Stairs Climbed', 'Stairs']);
      return v === null ? null : n(v);
    }
    default: {
      const v = val(r, k);
      return v === null ? null : n(v);
    }
  }
}
function date(r) {
  const v = val(r, 'date');
  if (!v) return null;
  const iso = String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (iso) return new Date(+iso[1], +iso[2] - 1, +iso[3]);
  const d = new Date(v);
  if (!isNaN(d)) return d;
  const m = String(v).match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})$/);
  if (m) {
    let y = +m[3];
    if (y < 100) y += 2000;
    return new Date(y, +m[2] - 1, +m[1]);
  }
  return null;
}
function rows(k) {
  return (data[k] || []).filter(r => Object.keys(r).length);
}
function originalFiltered(k) {
  const y = +$('year').value || (!$('year').value && ($('quarter').value || $('month').value) ? new Date().getFullYear() : 0);
  return rows(k).filter(r => {
    const d = date(r);
    return !d
      ? (!$('year').value && !$('quarter').value && !$('month').value)
      : (!y || d.getFullYear() === y) &&
        (!$('quarter').value || 'Q' + (Math.floor(d.getMonth() / 3) + 1) === $('quarter').value) &&
        (!$('month').value || d.getMonth() + 1 === +$('month').value);
  });
}
function filtered(k) {
  return originalFiltered(k);
}
function period(d, p) {
  const y = d.getFullYear(), m = d.getMonth();
  if (p === 'Daily') return d.toLocaleDateString();
  if (p === 'Weekly') {
    const x = new Date(y, m, d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return 'Week of ' + x.toLocaleDateString();
  }
  if (p === 'Monthly') return d.toLocaleString(undefined, { month: 'short', year: 'numeric' });
  if (p === 'Quarterly') return y + ' Q' + (Math.floor(m / 3) + 1);
  if (p === 'Half Yearly') return y + ' H' + (m < 6 ? 1 : 2);
  return String(y);
}
function bucket(rs, p) {
  const map = new Map();
  rs.forEach(r => {
    const d = date(r);
    if (!d) return;
    const k = period(d, p);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  });
  return [...map].sort((a, b) => date(a[1][0]) - date(b[1][0]));
}
function sum(rs, k) {
  const values = rs.map(r => metricValue(r, k)).filter(v => v !== null && Number.isFinite(v));
  return values.length ? values.reduce((a, b) => a + b, 0) : null;
}
function fmt(x) {
  return x === null || x === undefined || !Number.isFinite(Number(x))
    ? '—'
    : Number(x).toLocaleString(undefined, { maximumFractionDigits: 2 });
}
function fmtHoursMinutes(hours) {
  if (hours === null || hours === undefined || !Number.isFinite(Number(hours))) return '—';
  let t = Math.round(Number(hours) * 60), sign = t < 0 ? '-' : '';
  t = Math.abs(t);
  return sign + Math.floor(t / 60) + '.' + String(t % 60).padStart(2, '0');
}
function displayValue(v, unit) {
  return unit === 'hrs' ? fmtHoursMinutes(v) : fmt(v);
}

function podcastRecords(rs) {
  return rs.filter(r => ['Podcast Host', 'Podcast Name', 'Podcast Episode', 'Minutes', 'Hours'].some(k => String(r[k] ?? '').trim() !== ''));
}
function kpiValues(d, s, po, h) {
  const dates = new Set(h.filter(r => metricValue(r, 'steps') !== null).map(date).filter(Boolean).map(x => x.toDateString()));
  const st = sum(h, 'steps');
  return [sum(d, 'sleep'), sum(s, 'study'), st === null ? null : st / (dates.size || 1), podcastRecords(po).length];
}
function originalComparison(now = new Date()) {
  const y = +$('year').value || now.getFullYear(), m = +$('month').value, q = +$('quarter').value.slice(1), all = !$('year').value;
  if (m && q && Math.floor((m - 1) / 3) + 1 !== q) return null;
  const width = m ? 1 : q ? 3 : 12, startMonth = m ? m - 1 : q ? (q - 1) * 3 : 0;
  const start = new Date(y, startMonth, 1), end = new Date(y, startMonth + width, 1);
  const prev = new Date(y, startMonth - (all && m ? 12 : width), 1), prevEnd = new Date(prev.getFullYear(), prev.getMonth() + width, 1);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  if (start >= today) return null;
  const partial = today < end, stop = partial ? today : end;
  let priorStop = prevEnd;
  if (partial) {
    const offset = (stop.getFullYear() - start.getFullYear()) * 12 + stop.getMonth() - start.getMonth();
    const target = new Date(prev.getFullYear(), prev.getMonth() + offset, 1);
    const days = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    priorStop = new Date(target.getFullYear(), target.getMonth(), Math.min(stop.getDate(), days + 1));
    if (priorStop > prevEnd) priorStop = prevEnd;
  }
  const labelDate = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const labelRange = (a, b) => labelDate(a) + ' – ' + labelDate(new Date(b.getFullYear(), b.getMonth(), b.getDate() - 1));
  const collect = (a, b) => TRACKERS.map(([k]) => rows(k).filter(r => {
    const d = date(r);
    return d && d >= a && d < b;
  }));
  const current = collect(start, stop), previous = collect(prev, priorStop);
  const cv = kpiValues(...current), pv = kpiValues(...previous);
  const source = [0, 1, 3, 2];
  return cv.map((v, i) => ({
    previous: previous[source[i]].length ? pv[i] : null,
    current: v,
    change: (i === 3 ? podcastRecords(current[source[i]]).length : current[source[i]].length) &&
            (i === 3 ? podcastRecords(previous[source[i]]).length : previous[source[i]].length) &&
            v !== null && pv[i] !== null && pv[i] !== 0
      ? (v - pv[i]) / pv[i] * 100
      : null,
    label: (all || width === 12 ? 'YoY: ' : 'vs. ') + labelRange(prev, priorStop),
    detail: labelRange(start, stop) + ' vs ' + labelRange(prev, priorStop)
  }));
}
function comparison() {
  return originalComparison();
}
function oldCard(label, value, unit, comparison) {
  const display = displayValue(value, unit);
  const c = comparison?.change, rounded = c == null ? null : Math.round(c * 100) / 100;
  const tone = rounded > 0 ? 'up' : rounded < 0 ? 'down' : 'neutral';
  const delta = rounded == null ? 'N/A' : (rounded > 0 ? '▲ +' : rounded < 0 ? '▼ ' : '— ') + rounded.toFixed(2) + '%';
  return '<div class="card"><div class="metric">' + label + '</div><div class="value">' + display + ' <small class="muted">' + unit + '</small></div><div class="kpi-change ' + tone + '">' + delta + '</div><div class="kpi-period">' + (comparison?.detail || 'No comparable period') + '</div></div>';
}
function card(label, value, unit, comp) {
  return oldCard(label, value, unit, comp);
}

const chartPalette = {
  'Sleep (hrs)': '#38bdf8', 'Office (hrs)': '#fb923c', 'Exercise (hrs)': '#4ade80',
  'Study (hrs)': '#a78bfa', 'Articles / Blogs (hrs)': '#facc15', 'Article / Blogs (hrs)': '#facc15',
  'Podcast (hrs)': '#f472b6', 'Entertainment (hrs)': '#2dd4bf', 'Steps': '#60a5fa',
  'Distance (km)': '#c084fc', 'Stairs climbed': '#f97316', 'Records': '#14b8a6'
};
function chart(id, type, labels, datasets) {
  if (charts[id]) charts[id].destroy();
  const styled = datasets.map(ds => {
    const c = ds.borderColor || chartPalette[ds.label] || '#38bdf8';
    return {
      ...ds,
      borderColor: c,
      backgroundColor: type === 'bar' ? c : 'transparent',
      pointBackgroundColor: c,
      pointBorderColor: c,
      pointHoverBackgroundColor: c,
      borderWidth: 3,
      pointRadius: ds.borderDash ? 0 : type === 'line' ? 3 : 0,
      pointHoverRadius: 5,
      fill: false
    };
  });
  const hourChart = datasets.some(ds => /\(hrs\)/i.test(ds.label || ''));
  const textColor = getComputedStyle(document.body).getPropertyValue('--text').trim() || '#edf4fc';
  const mutedColor = getComputedStyle(document.body).getPropertyValue('--muted').trim() || '#9aacc2';
  const lineColor = getComputedStyle(document.body).getPropertyValue('--line').trim() || '#293b53';
  charts[id] = new Chart($(id), {
    type,
    data: { labels, datasets: styled },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: textColor } },
        tooltip: {
          callbacks: {
            label: ctx => hourChart
              ? (ctx.dataset.label + ': ' + displayValue(ctx.parsed.y, 'hrs'))
              : (ctx.dataset.label + ': ' + fmt(ctx.parsed.y))
          }
        }
      },
      scales: {
        x: { ticks: { color: mutedColor }, grid: { color: lineColor } },
        y: {
          beginAtZero: true,
          ticks: { color: mutedColor, callback: value => hourChart ? displayValue(value, 'hrs') : value },
          grid: { color: lineColor }
        }
      }
    }
  });
}

function table(rs, id, p) {
  if (!rs.length) {
    $(id).innerHTML = '<div class="empty">No records for this filter.</div>';
    return;
  }
  const numeric = k => rs.some(r => r[k] !== '' && r[k] !== null && r[k] !== undefined && Number.isFinite(Number(String(r[k]).replace(/,/g, ''))));
  const isHoursText = k => /hours?/i.test(k);
  const isMinutes = k => ['sleep minutes', 'sleep min', 'exercise min', 'exercise mins', 'exercise minutes', 'office min', 'office mins', 'office minutes', 'entertainment min', 'entertainment mins', 'entertainment minutes', 'minutes', 'article / blogs', 'articles / blogs'].includes(norm(k));
  const isPodcast = id === 'podcastTable', isEntertainment = id === 'entTable';
  const allKeys = [...new Set(rs.flatMap(r => Object.keys(r)))];
  const findKey = name => allKeys.find(k => norm(k) === norm(name));
  const movieKey = findKey('movie name'), languageKey = findKey('language'), yearKey = findKey('year') || findKey('unnamed: 10');
  const podcastFields = [];
  const cols = allKeys.filter(k =>
    norm(k) !== 'date' &&
    !isHoursText(k) &&
    !(isPodcast && (/^unnamed:/i.test(k) || norm(k).startsWith('entertainment') || [movieKey, languageKey, yearKey].includes(k) || podcastFields.includes(k))) &&
    (numeric(k) || isMinutes(k))
  );
  if (isPodcast) cols.push(...podcastFields);
  const label = k => {
    if (k === 'Minutes') return id === 'studyTable' ? 'Study (hrs)' : 'Podcast (hrs)';
    if (k === 'Article / Blogs') return 'Article / Blogs (hrs)';
    if (k === 'Sleep Minutes') return 'Sleep (hrs)';
    if (k === 'Office Min' || k === 'Office Minutes') return 'Office (hrs)';
    if (k === 'Exercise Min' || k === 'Exercise Minutes') return 'Exercise (hrs)';
    if (k === 'Entertainment Min' || k === 'Entertainment Minutes') return 'Entertainment (hrs)';
    return k;
  };
  const total = (items, k) => items.reduce((acc, r) => acc + n(r[k]), 0);
  const duration = k => isMinutes(k);
  const cell = (items, k) => isPodcast && podcastFields.includes(k)
    ? [...new Set(items.map(r => String(r[k] ?? '').trim()).filter(Boolean))].join(', ') || '—'
    : duration(k) ? fmtHoursMinutes(total(items, k) / 60) : fmt(total(items, k));
  const groups = bucket(rs, p);
  let out = '<table><thead><tr><th>Period</th>' + cols.map(k => '<th>' + label(k) + '</th>').join('') + (isEntertainment ? '<th>Movie Name (COUNT)</th><th>Language (COUNTD)</th><th>Year (COUNTD)</th>' : '') + '</tr></thead><tbody>';
  const summary = items => isEntertainment
    ? '<td>' + fmt(items.filter(r => String(r['Movie Name'] ?? '').trim()).length) + '</td><td>' + fmt(new Set(items.map(r => norm(r.Language)).filter(Boolean)).size) + '</td><td>' + fmt(new Set(items.map(r => norm(r.Year || r['Unnamed: 10'])).filter(Boolean)).size) + '</td>'
    : '';
  groups.forEach(([periodLabel, items]) => {
    out += '<tr><td>' + periodLabel + '</td>' + cols.map(k => '<td>' + cell(items, k) + '</td>').join('') + summary(items) + '</tr>';
  });
  out += '</tbody><tfoot><tr><td>Grand Total</td>' + cols.map(k => '<td>' + (isPodcast && podcastFields.includes(k) ? '' : cell(rs, k)) + '</td>').join('') + summary(rs) + '</tr></tfoot></table>';
  $(id).innerHTML = out;
}

function overviewTable(p) {
  const sources = {
    daily: filtered('daily'),
    study: filtered('study'),
    podcast: podcastFiltered(),
    health: filtered('health')
  };
  const fields = [
    ['Sleep (hrs)', 'daily', 'sleep', 'duration'],
    ['Exercise (hrs)', 'daily', 'exercise', 'duration'],
    ['Office (hrs)', 'daily', 'office', 'duration'],
    ['Study (hrs)', 'study', 'study', 'duration'],
    ['Podcast (hrs)', 'podcast', 'podcast', 'duration'],
    ['Article / Blogs (hrs)', 'study', 'articles', 'duration'],
    ['Entertainment (hrs)', 'podcast', 'entertainment', 'duration'],
    ['Movie Name (COUNT)', 'podcast', 'movie name', 'count'],
    ['Language (COUNTD)', 'podcast', 'language', 'distinct'],
    ['Year (COUNTD)', 'podcast', 'year', 'yearDistinct'],
    ['Water (ML)', 'health', 'water', 'waterMl'],
    ['Water (L)', 'health', 'water', 'numeric'],
    ['Steps', 'health', 'steps', 'numeric'],
    ['Distance KM', 'health', 'distance', 'numeric'],
    ['Stairs Climbed', 'health', 'stairs', 'numeric']
  ];
  const groupMaps = {};
  const periods = new Map();
  for (const [source, records] of Object.entries(sources)) {
    const groups = bucket(records, p);
    groupMaps[source] = new Map(groups);
    for (const [label, items] of groups) {
      const t = date(items[0]).getTime();
      if (!periods.has(label) || t < periods.get(label)) periods.set(label, t);
    }
  }
  const ordered = [...periods].sort((a, b) => a[1] - b[1]).map(x => x[0]);
  const calculate = (items, field, kind) => {
    if (kind === 'count') return items.filter(r => Object.keys(r).some(k => norm(k) === field && String(r[k] ?? '').trim())).length;
    if (kind === 'distinct' || kind === 'yearDistinct') {
      const values = items.map(r => {
        const k = Object.keys(r).find(k => norm(k) === field) || (kind === 'yearDistinct' ? Object.keys(r).find(k => norm(k) === 'unnamed: 10') : null);
        return k === undefined || k === null ? '' : norm(r[k]);
      }).filter(Boolean);
      return new Set(values).size;
    }
    if (kind === 'waterMl') return items.reduce((a, r) => a + (metricValue(r, 'water') || 0) * 1000, 0);
    return items.reduce((a, r) => a + (metricValue(r, field) || 0), 0);
  };
  const value = (items, field, kind) => {
    const v = calculate(items, field, kind);
    return kind === 'duration' ? fmtHoursMinutes(v) : fmt(v);
  };
  const header = '<tr><th>Period</th>' + fields.map(f => '<th>' + f[0] + '</th>').join('') + '</tr>';
  const body = ordered.map(label => '<tr><td>' + label + '</td>' + fields.map(([, source, field, kind]) => '<td>' + value(groupMaps[source].get(label) || [], field, kind) + '</td>').join('') + '</tr>').join('');
  const footer = '<tr><td>Grand Total</td>' + fields.map(([, source, field, kind]) => '<td>' + value(sources[source], field, kind) + '</td>').join('') + '</tr>';
  $('overviewTable').innerHTML = '<table><thead>' + header + '</thead><tbody>' + body + '</tbody><tfoot>' + footer + '</tfoot></table>';
}

function trackerSeries(tab, rs) {
  const defs = {
    daily: [['Sleep (hrs)', 'sleep'], ['Office (hrs)', 'office'], ['Exercise (hrs)', 'exercise']],
    study: [['Study (hrs)', 'study'], ['Articles / Blogs (hrs)', 'articles']],
    podcast: [['Podcast (hrs)', 'podcast']],
    health: [['Steps', 'steps'], ['Distance (km)', 'distance'], ['Stairs climbed', 'stairs'], ['Water (L)', 'water']]
  };
  return (defs[tab] || []).map(([label, id]) => [label, rs, id]);
}
function baseDrawMetric(tab, defs, p, canvasId) {
  const options = defs.map(x => [x[0], x[2]]);
  let chosen = activeMetric[tab];
  if (!options.some(x => x[1] === chosen)) chosen = options.length ? options[0][1] : '';
  activeMetric[tab] = chosen;
  const host = $(tab + 'Chips');
  if (host) {
    host.innerHTML = options.map(([label, id]) => '<button class="chip ' + (id === chosen ? 'active' : '') + '" data-metric="' + id + '">' + label + '</button>').join('');
    host.querySelectorAll('button').forEach(b => {
      b.onclick = () => {
        activeMetric[tab] = b.dataset.metric;
        render();
      };
    });
  }
  const picked = defs.find(x => x[2] === chosen);
  if (!picked) {
    if (charts[canvasId]) {
      charts[canvasId].destroy();
      delete charts[canvasId];
    }
    return;
  }
  const rs = picked[1], metric = picked[2], groups = bucket(rs, p);
  chart(canvasId, 'line', groups.map(x => x[0]), [{
    label: picked[0],
    data: groups.map(([, items]) => sum(items, metric) || 0),
    tension: 0.25
  }]);
}
function drawMetric(tab, defs, p, canvasId) {
  return baseDrawMetric(tab, defs, p, canvasId);
}
function podcastFiltered() {
  return ($('year').value || $('quarter').value || $('month').value) ? originalFiltered('podcast') : filtered('podcast');
}
function reportEscape(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function renderPodcastReport(records) {
  records = podcastFiltered();
  const episodes = podcastRecords(records);
  const total = episodes.reduce((a, r) => a + (metricValue(r, 'podcast') || 0), 0);
  const shows = new Set(episodes.map(r => String(r['Podcast Name'] || '').trim()).filter(Boolean)).size;
  const avg = episodes.length ? total / episodes.length : 0;
  $('podcastKpis').innerHTML = [
    ['TOTAL LISTENING TIME', displayValue(total, 'hrs')],
    ['EPISODES', fmt(episodes.length)],
    ['PODCAST SHOWS', fmt(shows)],
    ['AVG. LISTENING / EPISODE', displayValue(avg, 'hrs')]
  ].map(([label, value]) => '<div class="card"><div class="metric">' + label + '</div><div class="value">' + value + '</div></div>').join('');
  const sorted = [...episodes].sort((a, b) => (date(a)?.getTime() || 0) - (date(b)?.getTime() || 0));
  const dateLabel = r => {
    const d = date(r);
    return d ? d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : reportEscape(r.Date || '—');
  };
  $('podcastDetails').innerHTML = sorted.length
    ? '<table><thead><tr><th>Date</th><th>Podcast Host</th><th>Podcast Name</th><th>Podcast Episode</th><th>Listening Time</th></tr></thead><tbody>' +
      sorted.map(r => '<tr><td>' + dateLabel(r) + '</td><td>' + reportEscape(r['Podcast Host'] || '—') + '</td><td>' + reportEscape(r['Podcast Name'] || '—') + '</td><td>' + reportEscape(r['Podcast Episode'] || '—') + '</td><td>' + displayValue(metricValue(r, 'podcast'), 'hrs') + '</td></tr>').join('') +
      '</tbody><tfoot><tr><td>Grand Total</td><td></td><td></td><td></td><td>' + displayValue(total, 'hrs') + '</td></tr></tfoot></table>'
    : '<div class="empty">No podcast episodes for this filter.</div>';
}

function renderEntertainment(rs, p) {
  const q = norm($('entSearch')?.value || '');
  const langFilter = $('entLanguageFilter')?.value || '';
  const movies = rs.filter(r => String(r['Movie Name'] ?? '').trim() !== '');
  const langs = [...new Set(movies.map(r => String(r.Language ?? '').trim()).filter(Boolean))].sort();
  if ($('entLanguageFilter')) {
    const current = $('entLanguageFilter').value;
    $('entLanguageFilter').innerHTML = '<option value="">All languages</option>' + langs.map(l => '<option' + (l === current ? ' selected' : '') + '>' + reportEscape(l) + '</option>').join('');
    if (langFilter && langs.includes(langFilter)) $('entLanguageFilter').value = langFilter;
  }
  const filteredMovies = movies.filter(r => {
    const matchesLang = !langFilter || String(r.Language ?? '').trim() === langFilter;
    const matchesQuery = !q || norm(r['Movie Name']).includes(q) || norm(r.Language).includes(q);
    return matchesLang && matchesQuery;
  });
  const totalMins = filteredMovies.reduce((a, r) => a + n(r['Entertainment Min']), 0);
  const uniqueLangs = new Set(filteredMovies.map(r => norm(r.Language)).filter(Boolean)).size;
  $('entKpis').innerHTML = [
    ['TITLES LOGGED', fmt(filteredMovies.length)],
    ['ENTERTAINMENT TIME', fmtHoursMinutes(totalMins / 60) + ' hrs'],
    ['LANGUAGES', fmt(uniqueLangs)],
    ['AVG. RUNTIME', filteredMovies.length ? Math.round(totalMins / filteredMovies.length) + ' min' : '—']
  ].map(([label, value]) => '<div class="card entStat"><div class="metric">' + label + '</div><div class="value">' + value + '</div></div>').join('');

  const renderBars = (hostId, counts) => {
    const entries = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6);
    const max = entries[0]?.[1] || 1;
    $(hostId).innerHTML = entries.length
      ? '<div class="entBars">' + entries.map(([k, v]) => '<div class="entBarRow"><span>' + reportEscape(k) + '</span><div class="entBarTrack"><span style="width:' + Math.round((v / max) * 100) + '%"></span></div><span>' + v + '</span></div>').join('') + '</div>'
      : '<div class="empty">No data</div>';
  };
  const langCounts = new Map(), decadeCounts = new Map(), bucketCounts = new Map();
  filteredMovies.forEach(r => {
    const l = String(r.Language || 'Unknown').trim();
    langCounts.set(l, (langCounts.get(l) || 0) + 1);
    const yr = parseInt(r.Year || r['Unnamed: 10'], 10);
    const dec = Number.isFinite(yr) ? Math.floor(yr / 10) * 10 + 's' : 'Unknown';
    decadeCounts.set(dec, (decadeCounts.get(dec) || 0) + 1);
    const mins = n(r['Entertainment Min']);
    const b = mins < 90 ? '< 90m' : mins <= 150 ? '90–150m' : '> 150m';
    bucketCounts.set(b, (bucketCounts.get(b) || 0) + 1);
  });
  renderBars('entLanguages', langCounts);
  renderBars('entDecades', decadeCounts);
  renderBars('entBuckets', bucketCounts);

  const groups = bucket(filteredMovies, p);
  chart('entChart', 'bar', groups.map(x => x[0]), [{
    label: 'Entertainment (hrs)',
    data: groups.map(([, items]) => items.reduce((a, r) => a + n(r['Entertainment Min']) / 60, 0)),
    borderColor: '#2dd4bf'
  }]);

  $('entTable').innerHTML = filteredMovies.length
    ? '<table><thead><tr><th>Date</th><th>Movie Name</th><th>Language</th><th>Year</th><th>Runtime (min)</th></tr></thead><tbody>' +
      filteredMovies.map(r => '<tr><td>' + reportEscape(r.Date || '—') + '</td><td>' + reportEscape(r['Movie Name'] || '—') + '</td><td>' + reportEscape(r.Language || '—') + '</td><td>' + reportEscape(r.Year || r['Unnamed: 10'] || '—') + '</td><td>' + fmt(n(r['Entertainment Min'])) + '</td></tr>').join('') +
      '</tbody><tfoot><tr><td>Grand Total</td><td>' + fmt(filteredMovies.length) + ' titles</td><td>' + fmt(uniqueLangs) + '</td><td></td><td>' + fmt(totalMins) + '</td></tr></tfoot></table>'
    : '<div class="empty">No matching entertainment records.</div>';
}

function renderHighlights(d, s, po, h) {
  const sleepHrs = fmtHoursMinutes(sum(d, 'sleep') || 0);
  const studyHrs = fmtHoursMinutes(sum(s, 'study') || 0);
  const podHrs = fmtHoursMinutes(sum(po, 'podcast') || 0);
  const stepsTotal = fmt(sum(h, 'steps') || 0);
  $('highlights').innerHTML = '<div class="insightRow">' +
    '<span><strong>Sleep logged:</strong> ' + sleepHrs + ' hrs</span>' +
    '<span><strong>Study logged:</strong> ' + studyHrs + ' hrs</span>' +
    '<span><strong>Podcast logged:</strong> ' + podHrs + ' hrs</span>' +
    '<span><strong>Steps logged:</strong> ' + stepsTotal + '</span>' +
    '</div>';
}

function originalRender() {
  const p = $('period').value, d = filtered('daily'), s = filtered('study'), po = podcastFiltered(), h = filtered('health');
  const values = kpiValues(d, s, po, h), changes = comparison() || [];
  $('kpis').innerHTML = [
    ['Total Sleep Hours', 'hrs'],
    ['Total Study Hours', 'hrs'],
    ['Daily Avg Steps', 'steps'],
    ['Podcast Records', 'records']
  ].map(([label, unit], i) => card(label, values[i], unit, changes[i])).join('');
  renderHighlights(d, s, po, h);
  const series = [
    ['Sleep (hrs)', d, 'sleep'],
    ['Office (hrs)', d, 'office'],
    ['Exercise (hrs)', d, 'exercise'],
    ['Study (hrs)', s, 'study'],
    ['Articles / Blogs (hrs)', s, 'articles'],
    ['Podcast (hrs)', po, 'podcast']
  ];
  drawMetric('overview', series, p, 'trend');
  $('trendTitle').textContent = 'Overview Trends (hours) · ' + p + ' view';
  chart('records', 'bar', TRACKERS.map(x => x[1]), [{
    label: 'Records',
    data: TRACKERS.map(x => x[0] === 'podcast' ? podcastRecords(filtered(x[0])).length : filtered(x[0]).length)
  }]);
  overviewTable(p);
  TRACKERS.forEach(([k]) => {
    const rs = k === 'podcast' ? podcastFiltered() : filtered(k);
    table(rs, k + 'Table', p);
    const defs = trackerSeries(k, rs);
    drawMetric(k, defs, p, k + 'Chart');
  });
  renderPodcastReport(po, p);
  renderEntertainment(po, p);
}
function render() {
  return originalRender();
}

function filters() {
  const ds = TRACKERS.flatMap(([k]) => rows(k).map(date).filter(Boolean));
  const years = [...new Set(ds.map(d => d.getFullYear()))].sort((a, b) => b - a);
  $('year').innerHTML = '<option value="">All Years</option>' + years.map(y => '<option>' + y + '</option>').join('');
  $('month').innerHTML = '<option value="">All Months</option>' + Array.from({ length: 12 }, (_, i) => '<option value="' + (i + 1) + '">' + new Date(2000, i, 1).toLocaleString(undefined, { month: 'long' }) + '</option>').join('');
  const quickDefs = [
    ['All Time', () => { $('year').value = ''; $('quarter').value = ''; $('month').value = ''; }],
    ['This Year', () => { const latestY = years[0] || new Date().getFullYear(); $('year').value = String(latestY); $('quarter').value = ''; $('month').value = ''; }],
    ['This Month', () => { const now = new Date(); $('year').value = String(years.includes(now.getFullYear()) ? now.getFullYear() : (years[0] || now.getFullYear())); $('month').value = String(now.getMonth() + 1); $('quarter').value = ''; }]
  ];
  $('quick').innerHTML = quickDefs.map(([label], idx) => '<button type="button" data-q="' + idx + '">' + label + '</button>').join('');
  $('quick').querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      $('quick').querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      quickDefs[+btn.dataset.q][1]();
      render();
    };
  });
}

function getGoals() {
  try {
    return { ...DEFAULT_GOALS, ...(JSON.parse(localStorage.getItem('lifeos_goals_v2') || '{}')) };
  } catch {
    return { ...DEFAULT_GOALS };
  }
}
function openGoalDialog() {
  const g = getGoals();
  $('goalFields').innerHTML = [
    ['sleepHours', 'Daily Sleep Target (hrs)'],
    ['studyHours', 'Daily Study Target (hrs)'],
    ['dailySteps', 'Daily Steps Target'],
    ['podcastEpisodes', 'Target Podcast Episodes']
  ].map(([k, lbl]) => '<label><span>' + lbl + '</span><input type="number" step="any" name="' + k + '" value="' + g[k] + '"></label>').join('');
  $('goalDialog').showModal();
}

async function load() {
  $('status').className = 'status syncing';
  $('status').textContent = 'Syncing…';
  try {
    const r = await fetch(DATA + '?v=' + Date.now());
    if (!r.ok) throw Error('HTTP ' + r.status);
    data = await r.json();
    $('status').className = 'status';
    $('status').textContent = 'Live Sync Active';
  } catch {
    data = SAMPLE_DATA;
    $('status').className = 'status error';
    $('status').textContent = 'Offline / Sample Data';
  }
  filters();
  render();
  const updated = new Date();
  $('lastUpdated').textContent = 'Last updated: ' + updated.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  $('lastUpdated').title = 'Data refreshed at ' + updated.toLocaleString();
}

document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
    document.querySelectorAll('.section').forEach(x => x.classList.toggle('active', x.id === b.dataset.tab));
    render();
  };
});
$('navToggle').onclick = () => document.body.classList.toggle('navClosed');
$('theme').onclick = () => {
  document.body.classList.toggle('light');
  $('theme').textContent = document.body.classList.contains('light') ? '🌙 Theme' : '☀️ Theme';
  render();
};
$('refresh').onclick = load;
['year', 'quarter', 'month', 'period'].forEach(id => $(id).onchange = render);
$('reset').onclick = () => {
  $('year').value = '';
  $('quarter').value = '';
  $('month').value = '';
  $('period').value = 'Monthly';
  if ($('entSearch')) $('entSearch').value = '';
  if ($('entLanguageFilter')) $('entLanguageFilter').value = '';
  document.querySelectorAll('#quick button').forEach(b => b.classList.remove('active'));
  render();
};
$('goalButton').onclick = openGoalDialog;
$('goalCancel').onclick = () => $('goalDialog').close();
$('goalForm').onsubmit = e => {
  e.preventDefault();
  const fd = new FormData($('goalForm'));
  const next = {};
  for (const [k, v] of fd.entries()) next[k] = Number(v) || 0;
  localStorage.setItem('lifeos_goals_v2', JSON.stringify(next));
  $('goalDialog').close();
  render();
};
if ($('entSearch')) $('entSearch').oninput = () => renderEntertainment(podcastFiltered(), $('period').value);
if ($('entLanguageFilter')) $('entLanguageFilter').onchange = () => renderEntertainment(podcastFiltered(), $('period').value);

load();
</script>
