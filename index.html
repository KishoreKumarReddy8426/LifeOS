<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Tracker Dashboard - Google Sheets BI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 50:'#f0f9ff',100:'#e0f2fe',500:'#0284c7',600:'#0369a1',700:'#075985' } } } } }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
.glass-card { background: rgba(255,255,255,.9); backdrop-filter: blur(12px); }
.dark .glass-card { background: rgba(30,41,59,.8); backdrop-filter: blur(12px); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
.dark ::-webkit-scrollbar-thumb { background: #475569; }
.tab-btn.active { border-bottom: 3px solid #0284c7; color: #0284c7; font-weight: 600; }
.dark .tab-btn.active { border-bottom-color: #38bdf8; color: #38bdf8; }
.chip { padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid #cbd5e1; color: #64748b; cursor: pointer; transition: all .15s; }
.dark .chip { border-color: #475569; color: #94a3b8; }
.chip.on { color: #fff; border-color: transparent; }
.sel { width:100%; background:transparent; border:1px solid #cbd5e1; font-size:12px; border-radius:12px; padding:6px 10px; outline:none; cursor:pointer }
.dark .sel { border-color:#334155; background:#1e293b; color:#f1f5f9 }
.sel:focus { box-shadow:0 0 0 2px #0284c7 }
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

<header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white font-bold text-xl shadow-md"><i class="fa-solid fa-chart-pie"></i></div>
        <div>
          <span class="font-bold text-lg md:text-xl tracking-tight block leading-none">LifeTracker <span class="text-brand-500">BI</span></span>
          <span class="text-xs text-slate-400 font-medium" id="syncStatus">Live Sync Active</span>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button onclick="fetchSheetData()" class="flex items-center gap-2 px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-medium transition-all shadow-sm"><i class="fa-solid fa-arrows-rotate"></i><span>Refresh Data</span></button>
        <button id="themeToggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
          <i class="fa-solid fa-moon dark:hidden"></i><i class="fa-solid fa-sun hidden dark:inline"></i>
        </button>
      </div>
    </div>
    <div id="tabsContainer" class="flex space-x-2 md:space-x-6 overflow-x-auto border-t border-slate-100 dark:border-slate-700/60 pt-2 text-xs md:text-sm"></div>
  </div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
  <div class="glass-card border border-slate-200/80 dark:border-slate-700/60 rounded-2xl p-4 shadow-sm flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4">
    <div class="flex items-center gap-2 text-slate-700 dark:text-slate-200">
      <i class="fa-solid fa-filter text-brand-500"></i><span class="font-bold text-sm">Filters &amp; Parameters:</span>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-4 flex-1 max-w-4xl">
      <div><label class="block text-[10px] font-semibold text-slate-400 uppercase mb-0.5">Year</label>
        <select id="filterYear" onchange="onFilterChange()" class="sel"><option value="ALL">All Years</option></select></div>
      <div><label class="block text-[10px] font-semibold text-slate-400 uppercase mb-0.5">Quarter</label>
        <select id="filterQuarter" onchange="onFilterChange()" class="sel">
          <option value="ALL">All Quarters</option><option value="Q1">Q1 (Jan - Mar)</option><option value="Q2">Q2 (Apr - Jun)</option><option value="Q3">Q3 (Jul - Sep)</option><option value="Q4">Q4 (Oct - Dec)</option></select></div>
      <div><label class="block text-[10px] font-semibold text-slate-400 uppercase mb-0.5">Month</label>
        <select id="filterMonth" onchange="onFilterChange()" class="sel">
          <option value="ALL">All Months</option><option value="01">January</option><option value="02">February</option><option value="03">March</option><option value="04">April</option><option value="05">May</option><option value="06">June</option><option value="07">July</option><option value="08">August</option><option value="09">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div>
      <div><label class="block text-[10px] font-semibold text-brand-500 uppercase mb-0.5">X-Axis View By</label>
        <select id="viewBy" onchange="onFilterChange()" class="sel">
          <option value="day">Daily</option><option value="month">Monthly</option><option value="quarter">Quarterly</option><option value="year">Yearly</option></select></div>
    </div>
    <button onclick="resetFilters()" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors self-end lg:self-center"><i class="fa-solid fa-arrow-rotate-right mr-1"></i> Reset</button>
  </div>
  
  <div id="tabContent"></div>
</main>

<script>
const sheetId = "1NHnUz-DlmzCaFZFxY2b29feXY3jLSrZ9YbhMt0wBHpo";
const sheetsMap = { daily:"Daily Tracker", study:"Study Tracker", podcast:"Podcast Tracker", health:"Health Tracker" };
let masterData = {}, currentTab = 'overview', chartInstances = {};

const fallbackData = {
  daily: [
    { "Date":"2026-01-01","Sleep Minutes":"480","Exercise Min":"30","Office Min":"420" },
    { "Date":"2026-01-02","Sleep Minutes":"480","Exercise Min":"45","Office Min":"480" },
    { "Date":"2026-01-03","Sleep Minutes":"480","Exercise Min":"0","Office Min":"180" }],
  study: [
    { "Date":"2026-01-01","Category":"Technology","Topic":"Python Data Engineering","Minutes":"90","Hours":"1.5","Article / Blogs":"Pandas","Hours_1":"0.5" },
    { "Date":"2026-01-02","Category":"Data Science","Topic":"SQL Warehousing","Minutes":"120","Hours":"2.0","Article / Blogs":"Snowflake","Hours_1":"0.8" }],
  podcast: [
    { "Date":"2026-01-01","Podcast Name":"Huberman Lab","Podcast Episode":"Sleep","Minutes":"110","Hours":"1.83","Entertainment Min":"45","Entertainment Hours":"0.75" },
    { "Date":"2026-01-02","Podcast Name":"Huberman Lab","Podcast Episode":"Focus","Minutes":"60","Hours":"1.0","Entertainment Min":"30","Entertainment Hours":"0.5" }],
  health: [
    { "Date":"2026-01-01","Water (ML)":"2500","Water (L)":"2.5","Steps":"4948","Distance KM":"3.44","Stairs Climbed":"14" },
    { "Date":"2026-01-02","Water (ML)":"3200","Water (L)":"3.2","Steps":"17368","Distance KM":"13.52","Stairs Climbed":"7" }]
};

/* ---------- helpers ---------- */
const num = v => parseFloat(String(v ?? '').replace(/,/g, '')) || 0;
function hrs(v) {
  v = String(v ?? '').trim(); let m;
  if ((m = v.match(/^(\d+):(\d{1,2})/))) return +m[1] + m[2] / 60;
  if ((m = v.match(/(\d+)\s*h\w*\s*(?:(\d+)\s*m)?/i))) return +m[1] + (+m[2] || 0) / 60;
  return num(v);
}
const pick = (r, hKey, mKey) => hrs(r[hKey]) || (num(r[mKey]) / 60);
const pad = n => String(n).padStart(2, '0');
function normDate(s) {
  s = String(s || '').trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  const d = new Date(s);
  return isNaN(d) ? '' : `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
const prep = rows => rows.map(r => ({ ...r, _d: normDate(r.Date || r.date) }));

function parseCSV(t) {
  if (!t) return [];
  const rows = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; r.push(c); c = ''; rows.push(r); r = []; }
    else c += ch;
  }
  if (c || r.length) { r.push(c); rows.push(r); }
  const rs = rows.filter(x => x.some(v => v.trim()));
  if (rs.length < 2) return [];
  const seen = {};
  const hd = rs[0].map(h => { h = h.trim(); const n = seen[h] = (seen[h] ?? -1) + 1; return n ? `${h}_${n}` : h; });
  return prep(rs.slice(1).map(x => { const o = {}; hd.forEach((h, i) => o[h] = (x[i] || '').trim()); return o; }));
}

/* ---------- series & tab configuration ---------- */
const SERIES = {
  sleep:     { ds:'daily',    l:'Sleep (hrs)',          f:r => num(r['Sleep Minutes']) / 60, agg:'sum', c:'#6366f1' },
  office:    { ds:'daily',    l:'Office (hrs)',         f:r => num(r['Office Min']) / 60,    agg:'sum', c:'#f59e0b' },
  exercise:  { ds:'daily',    l:'Exercise (hrs)',       f:r => num(r['Exercise Min']) / 60,  agg:'sum', c:'#ef4444' },
  study:     { ds:'study',    l:'Study (hrs)',          f:r => pick(r, 'Hours', 'Minutes'),  agg:'sum', c:'#0ea5e9' },
  articles:  { ds:'study',    l:'Articles / Blogs (hrs)', f:r => hrs(r['Hours_1']),          agg:'sum', c:'#ec4899' },
  podcast:   { ds:'podcast',  l:'Podcast (hrs)',        f:r => pick(r, 'Hours', 'Minutes'),  agg:'sum', c:'#f59e0b' },
  entertain: { ds:'podcast',  l:'Entertainment (hrs)',  f:r => pick(r, 'Entertainment Hours', 'Entertainment Min'), agg:'sum', c:'#8b5cf6' },
  steps:     { ds:'health',   l:'Steps',                f:r => num(r['Steps']),              agg:'sum', c:'#10b981' },
  distance:  { ds:'health',   l:'Distance (km)',        f:r => num(r['Distance KM']),        agg:'sum', c:'#06b6d4' },
  stairs:    { ds:'health',   l:'Stairs climbed',       f:r => num(r['Stairs Climbed']),     agg:'sum', c:'#f97316' },
  water:     { ds:'health',   l:'Water (L)',            f:r => num(r['Water (L)']) || (num(r['Water (ML)']) / 1000), agg:'sum', c:'#3b82f6' }
};

const TABS = {
  overview: { label:'Executive Overview', icon:'fa-grip',         ids:['sleep','office','exercise','study','articles','podcast'] },
  daily:    { label:'Daily Tracker',      icon:'fa-bed',          ids:['sleep','office','exercise'] },
  study:    { label:'Study Tracker',      icon:'fa-book-open',    ids:['study','articles'] },
  podcast:  { label:'Podcast Tracker',    icon:'fa-podcast',      ids:['podcast','entertain'] },
  health:   { label:'Health Tracker',     icon:'fa-heart-pulse',  ids:['steps','distance','stairs','water'] }
};

const sel = {};
Object.entries(TABS).forEach(([k, t]) => sel[k] = t.ids[0]);

const viewBy = () => document.getElementById('viewBy').value;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function periodKey(day) {
  const v = viewBy();
  if (v === 'month') return day.slice(0, 7);
  if (v === 'quarter') return day.slice(0, 4) + '-Q' + Math.ceil(+day.slice(5, 7) / 3);
  if (v === 'year') return day.slice(0, 4);
  return day;
}

function labelFor(k) {
  if (viewBy() === 'month') return MON[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4);
  if (viewBy() === 'quarter') return k.replace('-', ' ');
  return k;
}

function seriesMap(rows, d) {
  const periodMap = new Map();
  rows.forEach(r => {
    if (!r._d) return;
    const k = periodKey(r._d), val = d.f(r);
    const curr = periodMap.get(k) || { sum: 0, count: 0 };
    curr.sum += val;
    curr.count += 1;
    periodMap.set(k, curr);
  });
  const out = new Map();
  periodMap.forEach((v, k) => {
    out.set(k, d.agg === 'avg' && v.count > 0 ? v.sum / v.count : v.sum);
  });
  return out;
}

/* ---------- setup ---------- */
document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('themeToggle').addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    setTimeout(() => renderTab(currentTab), 100);
  });
  renderTabsNav();
  await fetchSheetData();
});

function renderTabsNav() {
  document.getElementById('tabsContainer').innerHTML = Object.entries(TABS).map(([id, t]) => `
    <button onclick="switchTab('${id}')" id="tab-${id}" class="tab-btn py-2 px-3 text-slate-500 dark:text-slate-400 whitespace-nowrap ${id === currentTab ? 'active' : ''}">
      <i class="fa-solid ${t.icon} mr-1.5"></i> ${t.label}</button>`).join('');
}

async function fetchSheetData() {
  const statusEl = document.getElementById('syncStatus');
  statusEl.innerText = "Syncing Google Sheets...";
  let live = false;
  for (const key in sheetsMap) {
    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetsMap[key])}`;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error();
      const parsed = parseCSV(await res.text());
      if (parsed.length) { masterData[key] = parsed; live = true; } else masterData[key] = prep(fallbackData[key] || []);
    } catch (e) { masterData[key] = prep(fallbackData[key] || []); }
  }
  statusEl.innerText = live ? "Live Sync Active" : "Sample Data Active";
  populateYearFilter();
  renderTab(currentTab);
}

function populateYearFilter() {
  const years = new Set();
  Object.values(masterData).forEach(ds => ds.forEach(r => { if (r._d) years.add(r._d.slice(0, 4)); }));
  const sorted = [...years].sort().reverse();
  if (!sorted.length) sorted.push("2026");
  const prev = document.getElementById('filterYear').value;
  const want = sorted.includes(prev) ? prev : (prev === 'ALL' ? 'ALL' : (sorted.includes("2026") ? "2026" : sorted[0]));
  document.getElementById('filterYear').innerHTML = `<option value="ALL">All Years</option>` +
    sorted.map(y => `<option value="${y}" ${y === want ? 'selected' : ''}>${y}</option>`).join('');
}

function switchTab(id) {
  currentTab = id;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${id}`)?.classList.add('active');
  renderTab(id);
}

function onFilterChange() { renderTab(currentTab); }

function resetFilters() {
  ['filterYear','filterQuarter','filterMonth'].forEach(i => document.getElementById(i).value = 'ALL');
  document.getElementById('viewBy').value = 'day';
  renderTab(currentTab);
}

function filterDataset(data) {
  if (!data) return [];
  const year = document.getElementById('filterYear').value, quarter = document.getElementById('filterQuarter').value, month = document.getElementById('filterMonth').value;
  return data.filter(r => {
    if (!r._d) return true;
    const [y, m] = r._d.split('-'), q = Math.ceil(+m / 3);
    if (year !== 'ALL' && y !== year) return false;
    if (month !== 'ALL' && m !== month) return false;
    if (quarter !== 'ALL' && 'Q' + q !== quarter) return false;
    return true;
  });
}

function destroyCharts() { Object.values(chartInstances).forEach(c => c && c.destroy()); chartInstances = {}; }

function renderTab(tab) {
  const c = document.getElementById('tabContent');
  destroyCharts();
  tab === 'overview' ? renderOverview(c) : renderSheetTab(c, tab);
}

/* ---------- chips ---------- */
function chipsHTML(tab) {
  const t = TABS[tab];
  return `<div class="flex flex-wrap gap-2 mb-3">` + t.ids.map(id => {
    const on = sel[tab] === id, d = SERIES[id];
    return `<button class="chip ${on ? 'on' : ''}" style="${on ? `background:${d.c}` : ''}" onclick="selectSeries('${tab}','${id}')">${d.l}</button>`;
  }).join('') + `</div>`;
}

function selectSeries(tab, id) {
  sel[tab] = id;
  renderTab(tab);
}

/* ---------- main line chart ---------- */
function drawMain(tab) {
  const activeId = sel[tab];
  const d = SERIES[activeId];
  const mapData = seriesMap(filterDataset(masterData[d.ds]), d);
  const keys = [...mapData.keys()].sort();
  const dark = document.documentElement.classList.contains('dark');
  const tc = dark ? '#94a3b8' : '#64748b', gc = dark ? 'rgba(148,163,184,.12)' : 'rgba(100,116,139,.15)';
  
  chartInstances.main = new Chart(document.getElementById('mainChart').getContext('2d'), {
    type: 'line',
    data: {
      labels: keys.map(labelFor),
      datasets: [{
        label: d.l,
        data: keys.map(k => mapData.has(k) ? +mapData.get(k).toFixed(2) : null),
        borderColor: d.c,
        backgroundColor: d.c + '33',
        tension: .3,
        spanGaps: true,
        pointRadius: keys.length > 60 ? 0 : 3,
        fill: true
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: tc } } },
      scales: { x: { ticks: { color: tc, maxTicksLimit: 14 }, grid: { color: gc } }, y: { ticks: { color: tc }, grid: { color: gc }, beginAtZero: true } }
    }
  });
}

const viewLabel = () => ({ day:'Daily', month:'Monthly', quarter:'Quarterly', year:'Yearly' })[viewBy()];

const chartCard = (title, tab) => `
  <div class="glass-card border border-slate-200/80 dark:border-slate-700/60 p-5 rounded-2xl shadow-sm mb-6">
    <h3 class="font-bold text-sm mb-3">${title} <span class="text-slate-400 font-normal">· ${viewLabel()} view</span></h3>
    ${chipsHTML(tab)}
    <div class="h-72 relative"><canvas id="mainChart"></canvas></div>
  </div>`;

const kpiCard = (label, val, icon, col) => `
  <div class="glass-card border border-slate-200/80 dark:border-slate-700/60 p-5 rounded-2xl shadow-sm">
    <div class="flex items-center justify-between">
      <div><p class="text-xs font-semibold text-slate-400 uppercase">${label}</p><h3 class="text-2xl font-bold mt-1">${val}</h3></div>
      <div class="p-3 bg-${col}-500/10 text-${col}-500 rounded-xl"><i class="fa-solid ${icon} text-xl"></i></div>
    </div>
  </div>`;

function renderOverview(container) {
  const daily = filterDataset(masterData.daily), study = filterDataset(masterData.study),
        health = filterDataset(masterData.health), podcast = filterDataset(masterData.podcast);
  const sl = daily.filter(r => num(r['Sleep Minutes']) > 0);
  const totalSleepMins = sl.reduce((a, b) => a + num(b['Sleep Minutes']), 0);
  const totalSleepHrs = (totalSleepMins / 60).toFixed(1);
  const totalStudy = study.reduce((a, b) => a + SERIES.study.f(b), 0).toFixed(1);
  const st = health.filter(r => num(r['Steps']) > 0);
  const avgSteps = st.length ? Math.round(st.reduce((a, b) => a + num(b['Steps']), 0) / st.length) : 0;
  
  container.innerHTML = `
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      ${kpiCard('Total Sleep Hours', totalSleepHrs + ' hrs', 'fa-bed', 'indigo')}
      ${kpiCard('Total Study Hours', totalStudy + ' hrs', 'fa-book-open', 'sky')}
      ${kpiCard('Daily Avg Steps', avgSteps.toLocaleString(), 'fa-person-walking', 'emerald')}
      ${kpiCard('Podcast Records', podcast.length, 'fa-podcast', 'amber')}
    </div>
    ${chartCard('Overview Trends (hours)', 'overview')}
    <div class="glass-card border border-slate-200/80 dark:border-slate-700/60 p-5 rounded-2xl shadow-sm">
      <h3 class="font-bold text-sm mb-4">Records by Tracker</h3>
      <div class="h-64 relative"><canvas id="recordsBarChart"></canvas></div>
    </div>`;
    
  drawMain('overview');
  const dark = document.documentElement.classList.contains('dark'), tc = dark ? '#94a3b8' : '#64748b';
  chartInstances.recordsBar = new Chart(document.getElementById('recordsBarChart').getContext('2d'), {
    type: 'bar',
    data: { labels: ['Daily','Study','Podcast','Health'], datasets: [{ label: 'Rows', data: [daily.length, study.length, podcast.length, health.length], backgroundColor: '#0284c7', borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: tc } }, y: { ticks: { color: tc }, beginAtZero: true } } }
  });
}

function renderKPIsForTab(tab, data) {
  if (tab === 'daily') {
    const sl = data.filter(r => num(r['Sleep Minutes']) > 0);
    const totalSleepMins = sl.reduce((a, b) => a + num(b['Sleep Minutes']), 0);
    const totalSleepHrs = (totalSleepMins / 60).toFixed(1);
    const totalOffice = data.reduce((a, b) => a + SERIES.office.f(b), 0).toFixed(1);
    const totalEx = data.reduce((a, b) => a + SERIES.exercise.f(b), 0).toFixed(1);
    return `
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        ${kpiCard('Total Sleep', totalSleepHrs + ' hrs', 'fa-bed', 'indigo')}
        ${kpiCard('Total Office Work', totalOffice + ' hrs', 'fa-briefcase', 'amber')}
        ${kpiCard('Total Exercise', totalEx + ' hrs', 'fa-dumbbell', 'red')}
      </div>`;
  }
  if (tab === 'study') {
    const totalStudy = data.reduce((a, b) => a + SERIES.study.f(b), 0).toFixed(1);
    const totalArticles = data.reduce((a, b) => a + SERIES.articles.f(b), 0).toFixed(1);
    return `
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        ${kpiCard('Total Study Time', totalStudy + ' hrs', 'fa-book-open', 'sky')}
        ${kpiCard('Article / Blog Time', totalArticles + ' hrs', 'fa-newspaper', 'pink')}
        ${kpiCard('Sessions Count', data.length, 'fa-graduation-cap', 'emerald')}
      </div>`;
  }
  if (tab === 'podcast') {
    const totalPod = data.reduce((a, b) => a + SERIES.podcast.f(b), 0).toFixed(1);
    const totalEnt = data.reduce((a, b) => a + SERIES.entertain.f(b), 0).toFixed(1);
    return `
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        ${kpiCard('Podcast Listen Time', totalPod + ' hrs', 'fa-podcast', 'amber')}
        ${kpiCard('Entertainment Time', totalEnt + ' hrs', 'fa-film', 'purple')}
        ${kpiCard('Episodes Logged', data.length, 'fa-headphones', 'sky')}
      </div>`;
  }
  if (tab === 'health') {
    const st = data.filter(r => num(r['Steps']) > 0);
    const avgSteps = st.length ? Math.round(st.reduce((a, b) => a + num(b['Steps']), 0) / st.length) : 0;
    const totalDist = data.reduce((a, b) => a + SERIES.distance.f(b), 0).toFixed(1);
    const totalWater = data.reduce((a, b) => a + SERIES.water.f(b), 0).toFixed(1);
    const totalStairs = data.reduce((a, b) => a + SERIES.stairs.f(b), 0);
    return `
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        ${kpiCard('Daily Avg Steps', avgSteps.toLocaleString(), 'fa-person-walking', 'emerald')}
        ${kpiCard('Total Distance', totalDist + ' km', 'fa-route', 'cyan')}
        ${kpiCard('Total Water Intake', totalWater + ' L', 'fa-faucet-drip', 'blue')}
        ${kpiCard('Stairs Climbed', totalStairs.toLocaleString(), 'fa-stairs', 'orange')}
      </div>`;
  }
  return '';
}

function tableData(tab, data) {
  const tabDef = TABS[tab];
  const seriesDefs = tabDef.ids.map(id => SERIES[id]);
  
  if (viewBy() === 'day') {
    return {
      headers: ['Date', ...seriesDefs.map(d => d.l)],
      rows: data.map(r => [
        r._d || r.Date || '-',
        ...seriesDefs.map(d => d.f(r).toLocaleString('en-US', { maximumFractionDigits: 2 }))
      ])
    };
  }
  
  // Aggregate multi-series by active X-axis view (Month, Quarter, Year)
  const seriesMaps = seriesDefs.map(d => seriesMap(data, d));
  const keys = [...new Set(seriesMaps.flatMap(m => [...m.keys()]))].sort();
  const vLabel = ({ month:'Month', quarter:'Quarter', year:'Year' })[viewBy()];
  
  return {
    headers: [vLabel, ...seriesDefs.map(d => d.l)],
    rows: keys.map(k => [
      labelFor(k),
      ...seriesMaps.map(m => m.has(k) ? m.get(k).toLocaleString('en-US', { maximumFractionDigits: 2 }) : '-')
    ])
  };
}

function renderSheetTab(container, tab) {
  const data = filterDataset(masterData[tab]);
  if (!data.length) {
    container.innerHTML = `<div class="glass-card border border-slate-200/80 dark:border-slate-700/60 rounded-2xl p-8 text-center text-slate-400">No records found for the current filters.</div>`;
    return;
  }
  const { headers, rows } = tableData(tab, data);
  const kpis = renderKPIsForTab(tab, data);
  
  const tabDef = TABS[tab];
  const seriesDefs = tabDef.ids.map(id => SERIES[id]);

  container.innerHTML = kpis + chartCard(sheetsMap[tab] + ' Trend', tab) + `
    <div class="glass-card border border-slate-200/80 dark:border-slate-700/60 rounded-2xl overflow-hidden shadow-sm">
      <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
        <h3 class="font-bold text-sm">${sheetsMap[tab]} Table View <span class="text-slate-400 font-normal">· ${viewLabel()} view</span></h3><span class="text-xs text-slate-400">${rows.length} records</span>
      </div>
      <div class="overflow-x-auto max-h-[480px]"><table class="w-full text-xs text-left">
        <thead class="bg-slate-100 dark:bg-slate-800 text-slate-500 font-semibold uppercase border-b border-slate-200 dark:border-slate-700 sticky top-0"><tr>${headers.map(h => `<th class="px-4 py-3 whitespace-nowrap">${h}</th>`).join('')}</tr></thead>
        <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
          ${rows.map(r => `<tr>${r.map(v => `<td class="px-4 py-2.5 whitespace-nowrap">${v === '' || v == null ? '-' : v}</td>`).join('')}</tr>`).join('')}
        </tbody>
        <tfoot class="bg-slate-100 dark:bg-slate-800/80 font-bold border-t border-slate-200 dark:border-slate-700 sticky bottom-0">
          <tr>
            <td class="px-4 py-3">Grand Total / Overall</td>
            ${seriesDefs.map((d, idx) => {
              const colVals = rows.map(r => num(r[idx + 1]) || 0);
              const total = colVals.reduce((a, b) => a + b, 0);
              return `<td class="px-4 py-3">${total.toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>`;
            }).join('')}
          </tr>
        </tfoot>
      </table></div>
    </div>`;
  drawMain(tab);
}
</script>
</body>
</html>
