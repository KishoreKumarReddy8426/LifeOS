<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Tracker Dashboard - Google Sheets BI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        .tab-btn.active {
            border-bottom: 3px solid #0284c7;
            color: #0284c7;
            font-weight: 600;
        }
        .dark .tab-btn.active {
            border-bottom: 3px solid #38bdf8;
            color: #38bdf8;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Brand Info -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white font-bold text-xl shadow-md">
                        <i class="fa-solid fa-chart-pie"></i>
                    </div>
                    <div>
                        <span class="font-bold text-lg md:text-xl tracking-tight block leading-none">LifeTracker <span class="text-brand-500">BI</span></span>
                        <span class="text-xs text-slate-400 font-medium" id="syncStatus">Live Sync Active</span>
                    </div>
                </div>

                <!-- Theme Toggle & Refresh Button -->
                <div class="flex items-center space-x-3">
                    <button onclick="fetchSheetData()" class="flex items-center gap-2 px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-medium transition-all shadow-sm">
                        <i class="fa-solid fa-arrows-rotate"></i>
                        <span>Refresh Data</span>
                    </button>
                    <button id="themeToggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                        <i class="fa-solid fa-moon dark:hidden"></i>
                        <i class="fa-solid fa-sun hidden dark:inline"></i>
                    </button>
                </div>
            </div>

            <!-- Spreadsheet Tabs Bar -->
            <div id="tabsContainer" class="flex space-x-2 md:space-x-6 overflow-x-auto border-t border-slate-100 dark:border-slate-700/60 pt-2 no-scrollbar text-xs md:text-sm">
                <!-- Injected dynamically via script to prevent template literal errors -->
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">

        <!-- Global Filters Bar -->
        <div class="glass-card border border-slate-200/80 dark:border-slate-700/60 rounded-2xl p-4 shadow-sm flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
            <div class="flex items-center gap-2 text-slate-700 dark:text-slate-200">
                <i class="fa-solid fa-filter text-brand-500"></i>
                <span class="font-bold text-sm">Global Time Filters:</span>
            </div>

            <div class="grid grid-cols-3 gap-2 md:gap-4 flex-1 max-w-2xl">
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 uppercase mb-0.5">Year</label>
                    <select id="filterYear" onchange="onFilterChange()" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 text-xs rounded-xl px-2.5 py-1.5 outline-none focus:ring-2 focus:ring-brand-500 cursor-pointer">
                        <option value="ALL">All Years</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 uppercase mb-0.5">Quarter</label>
                    <select id="filterQuarter" onchange="onFilterChange()" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 text-xs rounded-xl px-2.5 py-1.5 outline-none focus:ring-2 focus:ring-brand-500 cursor-pointer">
                        <option value="ALL" selected>All Quarters</option>
                        <option value="Q1">Q1 (Jan - Mar)</option>
                        <option value="Q2">Q2 (Apr - Jun)</option>
                        <option value="Q3">Q3 (Jul - Sep)</option>
                        <option value="Q4">Q4 (Oct - Dec)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 uppercase mb-0.5">Month</label>
                    <select id="filterMonth" onchange="onFilterChange()" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 text-xs rounded-xl px-2.5 py-1.5 outline-none focus:ring-2 focus:ring-brand-500 cursor-pointer">
                        <option value="ALL" selected>All Months</option>
                        <option value="01">January</option>
                        <option value="02">February</option>
                        <option value="03">March</option>
                        <option value="04">April</option>
                        <option value="05">May</option>
                        <option value="06">June</option>
                        <option value="07">July</option>
                        <option value="08">August</option>
                        <option value="09">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>
            </div>

            <button onclick="resetFilters()" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors self-end md:self-center">
                <i class="fa-solid fa-arrow-rotate-right mr-1"></i> Reset
            </button>
        </div>

        <!-- Dynamic Content Section -->
        <div id="tabContent"></div>
    </main>

    <script>
        const sheetId = "1NHnUz-DlmzCaFZFxY2b29feXY3jLSrZ9YbhMt0wBHpo";
        const sheetsMap = {
            daily: "Daily Tracker",
            study: "Study Tracker",
            podcast: "Podcast Tracker",
            health: "Health Tracker",
            household: "Household Activity"
        };
        
        let masterData = {};
        let currentTab = 'overview';
        let chartInstances = {};

        const fallbackData = {
            daily: [
                { "Date": "2026-01-01", "Sleep Start": "0:30", "Sleep End": "9:45", "Sleep Minutes": "555", "Sleep Hours": "9 Hours 15 Minutes", "Exercise Min": "30", "Office Min": "420" },
                { "Date": "2026-01-02", "Sleep Start": "0:30", "Sleep End": "8:18", "Sleep Minutes": "468", "Sleep Hours": "7 Hours 48 Minutes", "Exercise Min": "45", "Office Min": "480" },
                { "Date": "2026-01-03", "Sleep Start": "0:31", "Sleep End": "10:07", "Sleep Minutes": "576", "Sleep Hours": "9 Hours 36 Minutes", "Exercise Min": "0", "Office Min": "180" }
            ],
            study: [
                { "Date": "2026-01-01", "Category": "Technology", "Topic": "Python Data Engineering", "Minutes": "90", "Hours": "1.5", "Article / Blogs": "Pandas", "Hours_1": "0.5" },
                { "Date": "2026-01-02", "Category": "Data Science", "Topic": "SQL Warehousing", "Minutes": "120", "Hours": "2.0", "Article / Blogs": "Snowflake", "Hours_1": "0.8" }
            ],
            podcast: [
                { "Date": "2026-01-01", "Podcast Host": "Huberman Lab", "Podcast Name": "Huberman Lab", "Podcast Episode": "Sleep", "Minutes": "110", "Hours": "1.83", "Entertainment Min": "45", "Entertainment Hours": "0.75", "Movie Name": "-" }
            ],
            health: [
                { "Date": "2026-01-01", "Water (ML)": "2500", "Water (L)": "2.5", "Steps": "4948", "Distance KM": "3.44", "Stairs Climbed": "14" },
                { "Date": "2026-01-02", "Water (ML)": "3200", "Water (L)": "3.2", "Steps": "17368", "Distance KM": "13.52", "Stairs Climbed": "7" }
            ],
            household: [
                { "Date": "2026-01-01", "Activity": "House Cleaning", "Duration Min": "45", "Category": "Maintenance" }
            ]
        };

        document.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            renderTabsNav();
            await fetchSheetData();
        });

        function initTheme() {
            document.getElementById('themeToggle').addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                setTimeout(() => renderTab(currentTab), 100);
            });
        }

        function renderTabsNav() {
            const tabsConfig = [
                { id: 'overview', label: 'Executive Overview', icon: 'fa-grip' },
                { id: 'daily', label: 'Daily Tracker', icon: 'fa-bed' },
                { id: 'study', label: 'Study Tracker', icon: 'fa-book-open' },
                { id: 'podcast', label: 'Podcast Tracker', icon: 'fa-podcast' },
                { id: 'health', label: 'Health Tracker', icon: 'fa-heart-pulse' },
                { id: 'household', label: 'Household Activity', icon: 'fa-house-chimney' }
            ];

            const container = document.getElementById('tabsContainer');
            container.innerHTML = tabsConfig.map(t => `
                <button onclick="switchTab('${t.id}')" id="tab-${t.id}" class="tab-btn py-2 px-3 text-slate-500 dark:text-slate-400 whitespace-nowrap ${t.id === currentTab ? 'active' : ''}">
                    <i class="fa-solid ${t.icon} mr-1.5"></i> ${t.label}
                </button>
            `).join('');
        }

        async function fetchSheetData() {
            const statusEl = document.getElementById('syncStatus');
            statusEl.innerText = "Syncing Google Sheets...";
            let liveSuccess = false;

            for (const key in sheetsMap) {
                const sheetName = sheetsMap[key];
                const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error("Fetch failed");
                    const csvText = await res.text();
                    const parsed = parseCSV(csvText);
                    if (parsed && parsed.length > 0) {
                        masterData[key] = parsed;
                        liveSuccess = true;
                    } else {
                        masterData[key] = fallbackData[key] || [];
                    }
                } catch(e) {
                    masterData[key] = fallbackData[key] || [];
                }
            }

            statusEl.innerText = liveSuccess ? "Live Sync Active" : "Sample Data Active";
            populateYearFilter();
            renderTab(currentTab);
        }

        function parseCSV(text) {
            if (!text) return [];
            const lines = text.trim().split('\n').map(l => l.split(',').map(c => c.replace(/^"|"$/g, '').trim()));
            if (lines.length < 2) return [];
            const headers = lines[0];
            return lines.slice(1).map(row => {
                let obj = {};
                headers.forEach((h, i) => obj[h] = row[i] || '');
                return obj;
            });
        }

        function populateYearFilter() {
            const yearSelect = document.getElementById('filterYear');
            const years = new Set();
            
            Object.values(masterData).forEach(dataset => {
                dataset.forEach(row => {
                    const dStr = row.Date || row.date || '';
                    if (dStr) {
                        const yr = dStr.substring(0, 4);
                        if (!isNaN(yr) && yr.length === 4) years.add(yr);
                    }
                });
            });

            const sortedYears = Array.from(years).sort().reverse();
            if (sortedYears.length === 0) sortedYears.push("2026");

            yearSelect.innerHTML = `<option value="ALL">All Years</option>` + 
                sortedYears.map(y => `<option value="${y}" ${y === "2026" ? "selected" : ""}>${y}</option>`).join('');
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const targetBtn = document.getElementById(`tab-${tabId}`);
            if (targetBtn) targetBtn.classList.add('active');
            renderTab(tabId);
        }

        function onFilterChange() { renderTab(currentTab); }
        function resetFilters() {
            document.getElementById('filterYear').value = 'ALL';
            document.getElementById('filterQuarter').value = 'ALL';
            document.getElementById('filterMonth').value = 'ALL';
            renderTab(currentTab);
        }

        function filterDataset(data) {
            if (!data) return [];
            const year = document.getElementById('filterYear').value;
            const quarter = document.getElementById('filterQuarter').value;
            const month = document.getElementById('filterMonth').value;

            return data.filter(item => {
                const dateStr = item.Date || item.date || '';
                if (!dateStr) return true;
                
                const parts = dateStr.split('-');
                if (parts.length < 2) return true;

                const y = parts[0];
                const m = parts[1];

                if (year !== 'ALL' && y !== year) return false;
                if (month !== 'ALL' && m !== month) return false;
                if (quarter !== 'ALL') {
                    const qInt = parseInt(m, 10);
                    if (quarter === 'Q1' && !(qInt >= 1 && qInt <= 3)) return false;
                    if (quarter === 'Q2' && !(qInt >= 4 && qInt <= 6)) return false;
                    if (quarter === 'Q3' && !(qInt >= 7 && qInt <= 9)) return false;
                    if (quarter === 'Q4' && !(qInt >= 10 && qInt <= 12)) return false;
                }
                return true;
            });
        }

        function destroyCharts() {
            Object.keys(chartInstances).forEach(k => { if (chartInstances[k]) chartInstances[k].destroy(); });
            chartInstances = {};
        }

        function renderTab(tab) {
            const container = document.getElementById('tabContent');
            destroyCharts();

            if (tab === 'overview') {
                renderOverview(container);
            } else {
                renderSheetTab(container, tab);
            }
        }

        function renderOverview(container) {
            const daily = filterDataset(masterData.daily);
            const study = filterDataset(masterData.study);
            const health = filterDataset(masterData.health);
            const podcast = filterDataset(masterData.podcast);
            const household = filterDataset(masterData.household);

            const avgSleepMinutes = daily.length ? (daily.reduce((a, b) => a + (parseFloat(b['Sleep Minutes'])||0), 0) / daily.length) : 0;
            const avgSleep = (avgSleepMinutes / 60).toFixed(1);
            const totalStudy = study.reduce((a, b) => a + (parseFloat(b['Hours'])||0), 0).toFixed(1);
            const avgSteps = health.length ? Math.round(health.reduce((a, b) => a + (parseFloat(b['Steps'])||0), 0) / health.length) : 0;

            container.innerHTML = `
                <!-- KPI Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                    <div class="glass-card border border-slate-200/80 dark:border-slate-700/60 p-5 rounded-2xl shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold text-slate-400 uppercase">Avg Sleep / Night</p>
                                <h3 class="text-2xl font-bold mt-1">${avgSleep} hrs</h3>
                            </div>
                            <div class="p-3 bg-indigo-500/10 text-indigo-500 rounded-xl">
                                <i class="fa-solid fa-bed text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <div class="glass-card border border-slate-200/80 dark:border-slate-700/60 p-5 rounded-2xl shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold text-slate-400 uppercase">Total Study Hours</p>
                                <h3 class="text-2xl font-bold mt-1">${totalStudy} hrs</h3>
                            </div>
                            <div class="p-3 bg-brand-500/10 text-brand-500 rounded-xl">
                                <i class="fa-solid fa-book-open text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <div class="glass-card border border-slate-200/80 dark:border-slate-700/60 p-5 rounded-2xl shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold text-slate-400 uppercase">Daily Avg Steps</p>
                                <h3 class="text-2xl font-bold mt-1">${avgSteps.toLocaleString()}</h3>
                            </div>
                            <div class="p-3 bg-emerald-500/10 text-emerald-500 rounded-xl">
                                <i class="fa-solid fa-person-walking text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <div class="glass-card border border-slate-200/80 dark:border-slate-700/60 p-5 rounded-2xl shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-xs font-semibold text-slate-400 uppercase">Podcast Records</p>
                                <h3 class="text-2xl font-bold mt-1">${podcast.length}</h3>
                            </div>
                            <div class="p-3 bg-amber-500/10 text-amber-500 rounded-xl">
                                <i class="fa-solid fa-podcast text-xl"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Charts Section -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="glass-card border border-slate-200/80 dark:border-slate-700/60 p-5 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-sm mb-4">Sleep & Study Overview</h3>
                        <div class="h-64 relative">
                            <canvas id="overviewChart"></canvas>
                        </div>
                    </div>

                    <div class="glass-card border border-slate-200/80 dark:border-slate-700/60 p-5 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-sm mb-4">Records by Tracker</h3>
                        <div class="h-64 relative flex items-center justify-center">
                            <canvas id="recordsBarChart"></canvas>
                        </div>
                    </div>
                </div>
            `;

            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#94a3b8' : '#64748b';

            if (daily.length > 0 || study.length > 0) {
                const dates = Array.from(new Set([...daily.map(d => d.Date || d.date), ...study.map(s => s.Date || s.date)])).filter(Boolean).sort();
                const sleepData = dates.map(dt => {
                    const row = daily.find(d => (d.Date || d.date) === dt);
                    return row ? ((parseFloat(row['Sleep Minutes'])||0)/60).toFixed(1) : 0;
                });
                const studyData = dates.map(dt => {
                    const row = study.find(s => (s.Date || s.date) === dt);
                    return row ? parseFloat(row['Hours'])||0 : 0;
                });

                chartInstances.overview = new Chart(document.getElementById('overviewChart').getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: dates.length ? dates : ['No Data'],
                        datasets: [
                            { label: 'Sleep hours', data: sleepData.length ? sleepData : [0], backgroundColor: '#0284c7', borderRadius: 4 },
                            { label: 'Study hours', data: studyData.length ? studyData : [0], backgroundColor: '#ec4899', borderRadius: 4 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { ticks: { color: textColor } },
                            y: { ticks: { color: textColor }, beginAtZero: true }
                        }
                    }
                });
            }

            // Records Bar Chart
            chartInstances.recordsBar = new Chart(document.getElementById('recordsBarChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: ['Daily', 'Study', 'Podcast', 'Health', 'Household'],
                    datasets: [{
                        label: 'Rows',
                        data: [daily.length, study.length, podcast.length, health.length, household.length],
                        backgroundColor: '#0284c7',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { ticks: { color: textColor } },
                        y: { ticks: { color: textColor }, beginAtZero: true }
                    }
                }
            });
        }

        function renderSheetTab(container, tabKey) {
            const rawData = masterData[tabKey] || [];
            const data = filterDataset(rawData);

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="glass-card border border-slate-200/80 dark:border-slate-700/60 rounded-2xl p-8 text-center text-slate-400">No records found for current filter settings.</div>`;
                return;
            }

            const headers = Object.keys(data[0]);

            container.innerHTML = `
                <div class="glass-card border border-slate-200/80 dark:border-slate-700/60 p-5 rounded-2xl shadow-sm mb-6">
                    <h3 class="font-bold text-sm mb-4">${sheetsMap[tabKey]} Trend Visualization</h3>
                    <div class="h-64 relative">
                        <canvas id="tabSpecificChart"></canvas>
                    </div>
                </div>

                <div class="glass-card border border-slate-200/80 dark:border-slate-700/60 rounded-2xl overflow-hidden shadow-sm">
                    <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                        <h3 class="font-bold text-sm">${sheetsMap[tabKey]} Table View</h3>
                        <span class="text-xs text-slate-400">${data.length} records</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs text-left">
                            <thead class="bg-slate-100 dark:bg-slate-800 text-slate-500 font-semibold uppercase border-b border-slate-200 dark:border-slate-700">
                                <tr>${headers.map(h => `<th class="px-4 py-3 whitespace-nowrap">${h}</th>`).join('')}</tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                                ${data.map(row => `<tr>${headers.map(h => `<td class="px-4 py-2.5 whitespace-nowrap">${row[h] || '-'}</td>`).join('')}</tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            renderSpecificChart(tabKey, data);
        }

        function renderSpecificChart(tabKey, data) {
            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#94a3b8' : '#64748b';
            const ctx = document.getElementById('tabSpecificChart').getContext('2d');
            const dates = data.map(d => d.Date || d.date || '');

            if (tabKey === 'daily') {
                const sleepHours = data.map(d => ((parseFloat(d['Sleep Minutes'])||0)/60).toFixed(1));
                chartInstances.tabChart = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: dates, datasets: [{ label: 'Sleep Hours', data: sleepHours, backgroundColor: '#6366f1' }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: textColor } }, y: { ticks: { color: textColor } } } }
                });
            } else if (tabKey === 'study') {
                const hours = data.map(d => parseFloat(d.Hours)||0);
                chartInstances.tabChart = new Chart(ctx, {
                    type: 'line',
                    data: { labels: dates, datasets: [{ label: 'Study Hours', data: hours, borderColor: '#0ea5e9', backgroundColor: 'rgba(14, 165, 233, 0.1)', fill: true }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: textColor } }, y: { ticks: { color: textColor } } } }
                });
            } else if (tabKey === 'podcast') {
                const podHrs = data.map(d => parseFloat(d.Hours)||0);
                chartInstances.tabChart = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: dates, datasets: [{ label: 'Podcast Hours', data: podHrs, backgroundColor: '#f59e0b' }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: textColor } }, y: { ticks: { color: textColor } } } }
                });
            } else if (tabKey === 'health') {
                const steps = data.map(d => parseFloat(d.Steps)||0);
                chartInstances.tabChart = new Chart(ctx, {
                    type: 'line',
                    data: { labels: dates, datasets: [{ label: 'Steps Count', data: steps, borderColor: '#10b981', fill: false }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: textColor } }, y: { ticks: { color: textColor } } } }
                });
            } else {
                const dur = data.map(d => parseFloat(d['Duration Min'] || d['Minutes'] || 0));
                chartInstances.tabChart = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: dates, datasets: [{ label: 'Activity Value', data: dur, backgroundColor: '#8b5cf6' }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: textColor } }, y: { ticks: { color: textColor } } } }
                });
            }
        }
    </script>
